<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Portal - Login & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-registration {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .auth-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .auth-header {
            background: #ffffff;
            padding: 2rem;
        }
        .auth-body {
            background: #f8f9fa;
            padding: 3rem 2.5rem;
        }
        .toggle-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .toggle-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container-fluid bg-registration py-5">
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 90vh;">
            <div class="col-lg-5 col-md-8">

                <!-- Login Form -->
                <div class="card auth-card form-section active" id="loginSection">
                    <div class="auth-header text-center">
                        <h3 class="mb-1 fw-bold">Student Login</h3>
                        <p class="text-muted">Access your class</p>
                    </div>
                    <div class="auth-body">
                        <form id="loginForm">
                            <div class="mb-4">
                                <input type="text" class="form-control form-control-lg" id="login_username" 
                                       placeholder="Username" required>
                            </div>
                            
                            <div class="mb-4">
                                <input type="password" class="form-control form-control-lg" id="login_password" 
                                       placeholder="Password" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">
                                Log In
                            </button>

                            <div class="text-center">
                                <p class="mb-0">
                                    Don't have an account? 
                                    <a href="#" class="toggle-link" id="showRegister">Register here</a>
                                </p>
                            </div>

                            <div class="text-center mt-3">
                                <p id="loginError" class="text-danger mb-0" style="display:none;">
                                    Invalid username or password
                                </p>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Register Form -->
                <div class="card auth-card form-section" id="registerSection">
                    <div class="auth-header text-center">
                        <h3 class="mb-1 fw-bold">Create Account</h3>
                        <p class="text-muted">Sign up to join classes</p>
                    </div>
                    <div class="auth-body">
                        <form id="registerForm">
                            <div class="mb-4">
                                <input type="text" class="form-control form-control-lg" id="register_username" 
                                       placeholder="Choose username" required>
                            </div>
                            
                            <div class="mb-4">
                                <input type="password" class="form-control form-control-lg" id="register_password" 
                                       placeholder="Create password" required>
                            </div>

                            <div class="mb-4">
                                <input type="password" class="form-control form-control-lg" id="register_password2" 
                                       placeholder="Confirm password" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">
                                Register
                            </button>

                            <div class="text-center">
                                <p class="mb-0">
                                    Already have an account? 
                                    <a href="#" class="toggle-link" id="showLogin">Login here</a>
                                </p>
                            </div>

                            <div class="text-center mt-3">
                                <p id="registerError" class="text-danger mb-0" style="display:none;">
                                    Please check your inputs
                                </p>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    const loginSection = document.getElementById('loginSection');
    const registerSection = document.getElementById('registerSection');
    
    document.getElementById('showRegister').addEventListener('click', (e) => {
        e.preventDefault();
        loginSection.classList.remove('active');
        registerSection.classList.add('active');
    });

    document.getElementById('showLogin').addEventListener('click', (e) => {
        e.preventDefault();
        registerSection.classList.remove('active');
        loginSection.classList.add('active');
    });

    // Optional: Basic client-side form handling example
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        // Add your login logic here (usually fetch to backend)
        document.getElementById('loginError').style.display = 'block';
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const pass1 = document.getElementById('register_password').value;
        const pass2 = document.getElementById('register_password2').value;
        const errorEl = document.getElementById('registerError');

        if (pass1 !== pass2) {
            errorEl.textContent = "Passwords do not match";
            errorEl.style.display = 'block';
            return;
        }

        if (pass1.length < 6) {
            errorEl.textContent = "Password must be at least 6 characters";
            errorEl.style.display = 'block';
            return;
        }

        // Add your registration logic here (usually fetch to backend)
        errorEl.textContent = "Registration successful! You can now log in.";
        errorEl.className = "text-success mb-0";
        errorEl.style.display = 'block';

        // Optional: switch to login after successful register
        // setTimeout(() => document.getElementById('showLogin').click(), 2000);
    });
</script>

</body>
</html>
