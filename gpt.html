<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Register</title>
</head>
<body>

<h2>Register</h2>

<input id="username" placeholder="Username"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>

<p id="msg"></p>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznOew-G8V0pKDb6XJprCGxKZ4yzu9jA3F9lq1jVY4d6iLD_WxHGCH3QGL6TsWc20GLkw/exec";

function register() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  // ✅ REQUIRED FIELDS
  if (!u || !p) {
    msg.innerText = "Fill all fields";
    return;
  }

  // ✅ MINIMUM PASSWORD RULE
  if (p.length < 6) {
    msg.innerText = "Password must be at least 6 characters";
    return;
  }

  const formData = new FormData();
  formData.append("username", u);
  formData.append("password", p);

  fetch(SCRIPT_URL, {
    method: "POST",
    body: formData
  })
  .then(r => r.text())
  .then(text => {
    if (text === "SUCCESS") {
      msg.innerText = "Registered successfully";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    } else {
      msg.innerText = text; // shows backend messages clearly
    }
  })
  .catch(() => {
    msg.innerText = "Server error";
  });
}
</script>

</body>
</html>
